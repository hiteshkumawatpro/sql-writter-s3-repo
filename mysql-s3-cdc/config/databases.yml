databases:
  - name: 
    driver: mysql
    host: 127.0.0.1
    port: 3306
    username: debezium
    password: replace-with-mysql-password
    database: application_db
    enabled: true
    # Must be unique among MySQL replication clients.
    server_id: 5401
    # Must be unique across every configured source.
    topic_prefix: cdc_mysql_main
    snapshot_mode: initial
    connection_time_zone: Asia/Calcutta

