databases:
  - name: btpprocessaudit
    driver: mysql
    host: 172.26.15.16
    port: 3306
    username: cdc_user
    password: ${MYSQL_MAIN_PASSWORD}
    database: btpprocessaudit
    enabled: true
    # Must be unique among MySQL replication clients.
    server_id: 5401
    # Must be unique across every configured source.
    topic_prefix: btpprocessaudit
    snapshot_mode: initial
    # Private-network server resets TLS negotiation; use an unencrypted DB connection.
    ssl_mode: disabled
    connection_time_zone: Asia/Calcutta

